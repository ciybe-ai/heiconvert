name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore heiconvert.Tests/heiconvert.Tests.csproj

      - name: Test
        run: dotnet test heiconvert.Tests/heiconvert.Tests.csproj --configuration Release --no-restore --verbosity normal
